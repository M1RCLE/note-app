# Стек: браузер -> frontend (nginx :8080) -> backend (Go :8080) -> db (PostgreSQL)
# Запуск: cp .env.example .env && docker compose up -d --build

name: notes

services:
  frontend:
    build: ./frontend
    image: notes-frontend:${APP_VERSION:-dev}
    ports:
      # Наружу публикуется только frontend.
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontend]
    restart: unless-stopped

  backend:
    build: ./backend
    image: notes-backend:${APP_VERSION:-dev}
    environment:
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-notes}
      DB_USER: ${DB_USER:-notes}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, see .env.example}
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, backend]
    restart: unless-stopped

  db:
    build: ./db
    image: notes-db:${APP_VERSION:-dev}
    environment:
      POSTGRES_DB: ${DB_NAME:-notes}
      POSTGRES_USER: ${DB_USER:-notes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, see .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped

networks:
  frontend:
  # internal: у сети нет выхода наружу, db доступна только backend.
  backend:
    internal: true

volumes:
  db-data:
