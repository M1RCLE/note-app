# nginx в контейнере frontend:
#   /       -> статика из /usr/share/nginx/html
#   /api/*  -> backend:8080 (имя сервиса в docker compose)

# Встроенный DNS Docker: имя "backend" переразрешается,
# если контейнер backend пересоздан и получил новый IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location /api/ {
        # Переменная заставляет nginx резолвить имя через resolver
        # при каждом запросе, а не один раз при старте.
        set $backend http://backend:8080;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
